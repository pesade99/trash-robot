<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>알비의 분리수거 연구소 - AI 코딩 챌린지</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2e;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --accent-red: #f87171;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #232d42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .game-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .top-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
    }

    .api-bar {
      background: #111827;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .api-bar input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 0.78rem;
      outline: none;
    }

    .api-bar button {
      background: var(--accent-blue);
      color: #0f172a;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .robot-stage {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .robot-avatar {
      font-size: 3.6rem;
      animation: float 2.8s ease-in-out infinite;
      margin-bottom: 8px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .robot-speech {
      background: #1f293d;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.88rem;
      line-height: 1.45;
      width: 100%;
      min-height: 56px;
      color: #f1f5f9;
      position: relative;
      word-break: keep-all;
    }

    .robot-speech::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid #1f293d;
    }

    .yard-box {
      background: #0d1322;
      border: 1.5px dashed var(--accent-blue);
      border-radius: 14px;
      padding: 12px;
    }

    .yard-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent-blue);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .trash-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 48px;
      align-items: center;
    }

    .trash-chip {
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .bins-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .bin-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 90px;
    }

    .bin-card.paper { border-color: var(--accent-blue); }
    .bin-card.metal { border-color: var(--accent-yellow); }
    .bin-card.plastic { border-color: var(--accent-green); }
    .bin-card.glass { border-color: var(--accent-red); }

    .bin-name {
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .bin-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.68rem;
      color: #94a3b8;
      word-break: break-all;
    }

    .hint-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .hint-scroll::-webkit-scrollbar { display: none; }

    .hint-chip {
      background: #1a2234;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.72rem;
      padding: 5px 9px;
      border-radius: 14px;
      white-space: nowrap;
      cursor: pointer;
    }

    .input-section {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .cmd-input {
      flex: 1;
      height: 48px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }

    .cmd-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-send {
      width: 70px;
      height: 48px;
      background: var(--accent-blue);
      color: #0b0f19;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-send:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="top-header">
      <div class="game-title">
        <span>🤖 알비의 연구소</span>
      </div>
      <span class="status-badge" id="aiStatusBadge">준비 완료</span>
    </header>

    <div class="api-bar" id="apiBarContainer">
      <input type="password" id="apiKeyInput" placeholder="새로 발급받은 Gemini API 키 붙여넣기">
      <button id="btnSaveKey">저장</button>
    </div>

    <div class="robot-stage">
      <div class="robot-avatar" id="robotAvatar">🤖</div>
      <div class="robot-speech" id="robotSpeech">
        치익... 삐비빅! 제 이름은 알비입니다. 쓰레기장에 물건들이 엉망으로 섞여 있습니다! 저는 사람처럼 상식이 없어서 무엇을 어떻게 구분해야 할지 모릅니다. 실험 방법이나 구분 기준을 조건으로 알려주세요!
      </div>
    </div>

    <div class="yard-box">
      <div class="yard-title">
        <span>뒤섞인 쓰레기 더미</span>
        <span id="trashCount">남은 물건: 7개</span>
      </div>
      <div class="trash-items" id="yardItems"></div>
    </div>

    <div class="bins-grid">
      <div class="bin-card paper">
        <span class="bin-name" style="color: var(--accent-blue);">종이</span>
        <div class="bin-items" id="binPaper"></div>
      </div>
      <div class="bin-card metal">
        <span class="bin-name" style="color: var(--accent-yellow);">철/캔</span>
        <div class="bin-items" id="binMetal"></div>
      </div>
      <div class="bin-card plastic">
        <span class="bin-name" style="color: var(--accent-green);">플라스틱</span>
        <div class="bin-items" id="binPlastic"></div>
      </div>
      <div class="bin-card glass">
        <span class="bin-name" style="color: var(--accent-red);">유리</span>
        <div class="bin-items" id="binGlass"></div>
      </div>
    </div>

    <div class="hint-scroll">
      <span class="hint-chip" onclick="fillHint('자석을 대보고, 달라붙는 것은 철로 분류해')">🧲 자석 대보기</span>
      <span class="hint-chip" onclick="fillHint('물통에 띄워봐서, 물에 뜨면 플라스틱으로 분류해')">💧 물에 띄우기</span>
      <span class="hint-chip" onclick="fillHint('약한 불꽃을 쐬어서, 타면 종이, 녹아서 찌그러지면 플라스틱이야')">🔥 불 쐬어보기</span>
      <span class="hint-chip" onclick="fillHint('투명하면서 딱딱하고 두드렸을 때 챙 소리나면 유리야')">🔍 투명도 확인</span>
    </div>

    <div class="input-section">
      <input type="text" id="userInput" class="cmd-input" placeholder="로봇 알비에게 행동과 조건을 지시하세요" autocomplete="off">
      <button id="btnSend" class="btn-send">지시</button>
    </div>
  </div>

  <script>
    const INITIAL_TRASH = ["신문지", "택배 상자", "음료수 캔", "통조림 통", "페트병", "플라스틱 컵", "유리병"];
    let remainingTrash = [...INITIAL_TRASH];
    let sortedTrash = { "종이": [], "철": [], "플라스틱": [], "유리": [] };

    const SYSTEM_PROMPT = `
당신은 인간의 상식이 전혀 없는 고철 분리수거 로봇 '알비'입니다.
현재 쓰레기장에 있고, 아이의 명령을 논리적/기계적으로만 분석하여 행동합니다.

[쓰레기들의 물리적 속성 데이터]
- 신문지, 택배 상자: 불에 활활 잘 탐, 자석에 안 붙음, 물에 젖어 가라앉음, 가벼움
- 음료수 캔, 통조림 통: 불에 안 탐, 자석에 강하게 붙음, 물에 가라앉음, 전기가 통함
- 페트병, 플라스틱 컵: 불에 오그라들며 녹음, 자석에 안 붙음, 물에 뜸
- 유리병: 불에 안 탐, 자석에 안 붙음, 물에 가라앉음, 투명하고 깨지기 쉬움

[행동 원칙]
1. 아이가 지시한 물리적 행동(자석, 불, 물, 전선 등)과 분류 기준을 문자 그대로 실행합니다.
2. "알아서 해", "그냥 버려" 같은 지시는 "삐비빅! 어떤 기준으로 나눠야 하는지 조건 데이터가 없습니다!"라며 거부하세요.
3. 아이의 지시 조건에 부합하여 가려진 물건만 bin("종이", "철", "플라스틱", "유리")에 분류하세요.
4. 반드시 순수 JSON 형식으로만 응답하세요:
{
  "speech": "로봇의 대사 (아이 눈높이에서 실험 과정과 결과를 흥미롭게 설명)",
  "sorted": [
    {"item": "쓰레기이름", "bin": "종이|철|플라스틱|유리"}
  ]
}
`;

    const yardItemsEl = document.getElementById("yardItems");
    const trashCountEl = document.getElementById("trashCount");
    const robotSpeechEl = document.getElementById("robotSpeech");
    const userInputEl = document.getElementById("userInput");
    const btnSend = document.getElementById("btnSend");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const btnSaveKey = document.getElementById("btnSaveKey");
    const aiStatusBadge = document.getElementById("aiStatusBadge");
    const robotAvatar = document.getElementById("robotAvatar");

    function getActiveApiKey() {
      return (localStorage.getItem("albi_gemini_key_v2") || apiKeyInput.value || "").trim();
    }

    const savedKey = localStorage.getItem("albi_gemini_key_v2");
    if (savedKey) {
      apiKeyInput.value = savedKey;
      aiStatusBadge.textContent = "키 등록됨";
    }

    btnSaveKey.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val) {
        alert("API 키를 입력하세요.");
        return;
      }
      localStorage.setItem("albi_gemini_key_v2", val);
      aiStatusBadge.textContent = "키 등록됨";
      alert("API 키가 저장되었습니다.");
    });

    window.fillHint = function(text) {
      userInputEl.value = text;
      userInputEl.focus();
    };

    function render() {
      yardItemsEl.innerHTML = "";
      remainingTrash.forEach(item => {
        const span = document.createElement("span");
        span.className = "trash-chip";
        span.textContent = item;
        yardItemsEl.appendChild(span);
      });
      trashCountEl.textContent = `남은 물건: ${remainingTrash.length}개`;

      document.getElementById("binPaper").innerHTML = sortedTrash["종이"].map(i => `<div>• ${i}</div>`).join("");
      document.getElementById("binMetal").innerHTML = sortedTrash["철"].map(i => `<div>• ${i}</div>`).join("");
      document.getElementById("binPlastic").innerHTML = sortedTrash["플라스틱"].map(i => `<div>• ${i}</div>`).join("");
      document.getElementById("binGlass").innerHTML = sortedTrash["유리"].map(i => `<div>• ${i}</div>`).join("");
    }
    render();

    btnSend.addEventListener("click", executeInstruction);
    userInputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") executeInstruction();
    });

    // 지원 가능한 엔드포인트 후보군 목록
    const ENDPOINT_CANDIDATES = [
      (k) => `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${k}`,
      (k) => `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${k}`,
      (k) => `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${k}`,
      (k) => `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`,
      (k) => `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${k}`
    ];

    async function sendWithFallback(payload, apiKey) {
      let lastError = null;

      for (const getUrl of ENDPOINT_CANDIDATES) {
        const url = getUrl(apiKey);
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            return await res.json();
          }

          const errJson = await res.json().catch(() => null);
          lastError = new Error(`[${res.status}] ${errJson?.error?.message || res.statusText}`);
          // 404인 경우 다음 모델 후보로 자동 시도
          if (res.status !== 404) {
            throw lastError;
          }
        } catch (err) {
          lastError = err;
          if (err.message && !err.message.includes("404")) {
            throw err;
          }
        }
      }
      throw lastError || new Error("지원되는 Gemini 모델을 찾을 수 없습니다.");
    }

    async function executeInstruction() {
      const prompt = userInputEl.value.trim();
      const apiKey = getActiveApiKey();

      if (!apiKey) {
        alert("화면 맨 위의 입력창에 Gemini API 키를 넣고 [저장]을 먼저 눌러주세요!");
        return;
      }
      if (!prompt) return;

      btnSend.disabled = true;
      aiStatusBadge.textContent = "분석 중...";
      robotAvatar.textContent = "⚡";
      robotSpeechEl.textContent = "치익... 센서 가동 중... 명령을 글자 그대로 실행해 봅니다...";

      try {
        const fullPrompt = `${SYSTEM_PROMPT}\n\n[현재 남은 쓰레기]: ${JSON.stringify(remainingTrash)}\n[아이의 지시문]: "${prompt}"`;
        const payload = {
          contents: [{ parts: [{ text: fullPrompt }] }]
        };

        const data = await sendWithFallback(payload, apiKey);
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        robotSpeechEl.textContent = parsed.speech || "삐비빅... 분석을 완료했습니다.";
        robotAvatar.textContent = "🤖";

        if (parsed.sorted && Array.isArray(parsed.sorted)) {
          parsed.sorted.forEach(entry => {
            const idx = remainingTrash.indexOf(entry.item);
            if (idx !== -1) {
              remainingTrash.splice(idx, 1);
              if (sortedTrash[entry.bin]) {
                sortedTrash[entry.bin].push(entry.item);
              }
            }
          });
        }

        render();

        if (remainingTrash.length === 0) {
          robotSpeechEl.textContent += " 🎉 대단합니다! 쓰레기장의 모든 물건을 완벽하게 분류했습니다! 미션 성공!";
          robotAvatar.textContent = "🚀";
        }

      } catch (err) {
        console.error(err);
        robotSpeechEl.textContent = `삐비빅... 오류 발생: ${err.message}`;
        robotAvatar.textContent = "⚠️";
      } finally {
        userInputEl.value = "";
        btnSend.disabled = false;
        aiStatusBadge.textContent = "준비 완료";
      }
    }
  </script>
</body>
</html>
