<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>알비의 분리수거 연구소 - AI 코딩 챌린지</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131927;
      --card-inner: #1b2438;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --accent-red: #f87171;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #232f48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100dvh;
      max-height: 900px;
    }

    /* 헤더 */
    .top-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .game-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
    }

    /* API 키 설정 */
    .api-bar {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .api-bar input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      color: #fff;
      font-size: 0.76rem;
      outline: none;
    }

    .api-bar button {
      background: var(--accent-blue);
      color: #0b0f19;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
    }

    /* 쓰레기 현황 */
    .yard-box {
      background: var(--card-bg);
      border: 1.5px dashed var(--accent-blue);
      border-radius: 12px;
      padding: 10px 12px;
      flex-shrink: 0;
    }

    .yard-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-blue);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .trash-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
      align-items: center;
    }

    .trash-chip {
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 4px 9px;
      border-radius: 16px;
      font-size: 0.74rem;
      font-weight: 600;
    }

    /* 분리수거함 */
    .bins-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .bin-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 76px;
    }

    .bin-card.paper { border-color: var(--accent-blue); }
    .bin-card.metal { border-color: var(--accent-yellow); }
    .bin-card.plastic { border-color: var(--accent-green); }
    .bin-card.glass { border-color: var(--accent-red); }

    .bin-name {
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .bin-items {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.65rem;
      color: #94a3b8;
    }

    /* 실시간 대화창 (채팅방 형태) */
    .chat-box {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 140px;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      line-height: 1.45;
      font-size: 0.85rem;
      word-break: keep-all;
    }

    .chat-msg.robot {
      align-self: flex-start;
    }

    .chat-msg.user {
      align-self: flex-end;
    }

    .msg-sender {
      font-size: 0.68rem;
      color: var(--text-sub);
      margin-bottom: 2px;
      font-weight: 700;
    }

    .chat-msg.user .msg-sender {
      text-align: right;
      color: var(--accent-blue);
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 14px;
    }

    .chat-msg.robot .msg-bubble {
      background: var(--card-inner);
      color: #f1f5f9;
      border: 1px solid #2d3b55;
      border-top-left-radius: 2px;
    }

    .chat-msg.user .msg-bubble {
      background: #0284c7;
      color: #ffffff;
      border-top-right-radius: 2px;
    }

    /* 직접 입력 섹션 */
    .input-section {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .cmd-input {
      flex: 1;
      height: 48px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }

    .cmd-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-send {
      width: 72px;
      height: 48px;
      background: var(--accent-blue);
      color: #090d16;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-send:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="top-header">
      <div class="game-title">
        <span>🤖 알비의 분리수거 연구소</span>
      </div>
      <span class="status-badge" id="aiStatusBadge">대기 중</span>
    </header>

    <!-- API 키 설정창 -->
    <div class="api-bar">
      <input type="password" id="apiKeyInput" placeholder="Gemini API 키 (AIzaSy...)">
      <button id="btnSaveKey">저장</button>
    </div>

    <!-- 쓰레기장 현황 -->
    <div class="yard-box">
      <div class="yard-title">
        <span>뒤섞인 쓰레기 더미</span>
        <span id="trashCount">남은 물건: 7개</span>
      </div>
      <div class="trash-items" id="yardItems"></div>
    </div>

    <!-- 4대 분리수거함 -->
    <div class="bins-grid">
      <div class="bin-card paper">
        <span class="bin-name" style="color: var(--accent-blue);">종이</span>
        <div class="bin-items" id="binPaper"></div>
      </div>
      <div class="bin-card metal">
        <span class="bin-name" style="color: var(--accent-yellow);">철/캔</span>
        <div class="bin-items" id="binMetal"></div>
      </div>
      <div class="bin-card plastic">
        <span class="bin-name" style="color: var(--accent-green);">플라스틱</span>
        <div class="bin-items" id="binPlastic"></div>
      </div>
      <div class="bin-card glass">
        <span class="bin-name" style="color: var(--accent-red);">유리</span>
        <div class="bin-items" id="binGlass"></div>
      </div>
    </div>

    <!-- 직접 대화창 (채팅 기록) -->
    <div class="chat-box" id="chatBox">
      <div class="chat-msg robot">
        <span class="msg-sender">🤖 로봇 알비</span>
        <div class="msg-bubble">
          치익... 삐비빅! 제 이름은 알비입니다. 쓰레기장에 물건들이 섞여 있는데, 저는 인간처럼 상식이 없어서 무엇을 어떻게 나눠야 할지 모릅니다. 실험 방법이나 구분 기준을 문장으로 직접 알려주세요!
        </div>
      </div>
    </div>

    <!-- 아이 직접 텍스트 입력창 -->
    <div class="input-section">
      <input type="text" id="userInput" class="cmd-input" placeholder="알비에게 내릴 명령을 직접 입력하세요..." autocomplete="off">
      <button id="btnSend" class="btn-send">전송</button>
    </div>
  </div>

  <script>
    const INITIAL_TRASH = ["신문지", "택배 상자", "음료수 캔", "통조림 통", "페트병", "플라스틱 컵", "유리병"];
    let remainingTrash = [...INITIAL_TRASH];
    let sortedTrash = { "종이": [], "철": [], "플라스틱": [], "유리": [] };

    const SYSTEM_PROMPT = `
당신은 인간의 상식이 전혀 없는 고철 분리수거 로봇 '알비'입니다.
현재 쓰레기장에 있고, 아이가 키보드로 직접 타이핑한 지시문을 기계적/논리적으로 분석하여 실행합니다.

[남아있는 쓰레기들의 물리적 속성 사실]
- 신문지, 택배 상자: 불에 활활 잘 탐, 자석에 안 붙음, 물에 젖어 가라앉음, 가벼움
- 음료수 캔, 통조림 통: 불에 안 탐, 자석에 강하게 붙음, 물에 가라앉음, 전기가 통함
- 페트병, 플라스틱 컵: 불에 오그라들며 녹음, 자석에 안 붙음, 물에 뜸
- 유리병: 불에 안 탐, 자석에 안 붙음, 물에 가라앉음, 투명하고 깨지기 쉬움

[행동 원칙]
1. 아이가 지시한 물리적 실험(불, 자석, 물, 두드리기 등)과 조건문을 그대로 실행합니다.
2. "알아서 나눠", "그냥 버려" 같은 상식에 기댄 명령은 "삐비빅! 어떤 조건과 실험으로 나눠야 하는지 기준이 없습니다!"라며 거부하세요.
3. 아이의 지시 조건에 부합하여 가려진 물건만 bin("종이", "철", "플라스틱", "유리")에 분류하세요.
4. 반드시 순수 JSON 형식으로만 응답하세요:
{
  "speech": "로봇의 대사 (아이 눈높이에서 실험 과정과 결과를 설명)",
  "sorted": [
    {"item": "쓰레기이름", "bin": "종이|철|플라스틱|유리"}
  ]
}
`;

    const yardItemsEl = document.getElementById("yardItems");
    const trashCountEl = document.getElementById("trashCount");
    const chatBox = document.getElementById("chatBox");
    const userInputEl = document.getElementById("userInput");
    const btnSend = document.getElementById("btnSend");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const btnSaveKey = document.getElementById("btnSaveKey");
    const aiStatusBadge = document.getElementById("aiStatusBadge");

    function getActiveApiKey() {
      return (localStorage.getItem("albi_gemini_key_v3") || apiKeyInput.value || "").trim();
    }

    const savedKey = localStorage.getItem("albi_gemini_key_v3");
    if (savedKey) {
      apiKeyInput.value = savedKey;
      aiStatusBadge.textContent = "키 준비됨";
    }

    btnSaveKey.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val) {
        alert("API 키를 입력하세요.");
        return;
      }
      localStorage.setItem("albi_gemini_key_v3", val);
      aiStatusBadge.textContent = "키 준비됨";
      alert("API 키가 저장되었습니다. 이제 아래 입력창으로 아이가 직접 문장을 입력해 보세요!");
    });

    function appendMessage(sender, text, isUser) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `chat-msg ${isUser ? "user" : "robot"}`;
      msgDiv.innerHTML = `
        <span class="msg-sender">${sender}</span>
        <div class="msg-bubble">${text}</div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function render() {
      yardItemsEl.innerHTML = "";
      remainingTrash.forEach(item => {
        const span = document.createElement("span");
        span.className = "trash-chip";
        span.textContent = item;
        yardItemsEl.appendChild(span);
      });
      trashCountEl.textContent = `남은 물건: ${remainingTrash.length}개`;

      document.getElementById("binPaper").innerHTML = sortedTrash["종이"].map(i => `<div>• ${i}</div>`).join("");
      document.getElementById("binMetal").innerHTML = sortedTrash["철"].map(i => `<div>• ${i}</div>`).join("");
      document.getElementById("binPlastic").innerHTML = sortedTrash["플라스틱"].map(i => `<div>• ${i}</div>`).join("");
      document.getElementById("binGlass").innerHTML = sortedTrash["유리"].map(i => `<div>• ${i}</div>`).join("");
    }
    render();

    btnSend.addEventListener("click", executeInstruction);
    userInputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") executeInstruction();
    });

    // 404 방지: 지원 가능한 최신 모델 자동 탐색
    async function getAvailableModel(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const models = data.models || [];
          const flash = models.find(m => m.name.includes("flash") && m.supportedGenerationMethods?.includes("generateContent"));
          if (flash) return flash.name; // e.g. "models/gemini-2.0-flash" or "models/gemini-1.5-flash-latest"
          const any = models.find(m => m.supportedGenerationMethods?.includes("generateContent"));
          if (any) return any.name;
        }
      } catch (e) {
        console.warn(e);
      }
      return "models/gemini-2.0-flash";
    }

    async function executeInstruction() {
      const prompt = userInputEl.value.trim();
      const apiKey = getActiveApiKey();

      if (!apiKey) {
        alert("상단에 발급받은 Gemini API 키를 넣고 [저장]을 먼저 눌러주세요!");
        return;
      }
      if (!prompt) return;

      appendMessage("🧑‍💻 나(아이)", prompt, true);
      userInputEl.value = "";
      btnSend.disabled = true;
      aiStatusBadge.textContent = "생각 중...";

      try {
        const modelName = await getAvailableModel(apiKey);
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;

        const fullPrompt = `${SYSTEM_PROMPT}\n\n[현재 남은 쓰레기]: ${JSON.stringify(remainingTrash)}\n[아이의 지시문]: "${prompt}"`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        });

        if (!res.ok) {
          const errDetail = await res.json().catch(() => null);
          throw new Error(`[오류 코드 ${res.status}] ${errDetail?.error?.message || res.statusText}`);
        }

        const data = await res.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        appendMessage("🤖 로봇 알비", parsed.speech || "삐비빅... 지시를 수행했습니다.", false);

        if (parsed.sorted && Array.isArray(parsed.sorted)) {
          parsed.sorted.forEach(entry => {
            const idx = remainingTrash.indexOf(entry.item);
            if (idx !== -1) {
              remainingTrash.splice(idx, 1);
              if (sortedTrash[entry.bin]) {
                sortedTrash[entry.bin].push(entry.item);
              }
            }
          });
        }

        render();

        if (remainingTrash.length === 0) {
          appendMessage("🎉 미션 성공", "대단합니다! 아이의 훌륭한 명령으로 쓰레기장의 모든 물건을 완벽하게 분류했습니다!", false);
        }

      } catch (err) {
        console.error(err);
        appendMessage("⚠️ 오류 알림", `삐비빅... 문제가 발생했습니다: ${err.message}`, false);
      } finally {
        btnSend.disabled = false;
        aiStatusBadge.textContent = "준비 완료";
        userInputEl.focus();
      }
    }
  </script>
</body>
</html>
