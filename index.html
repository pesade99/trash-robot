<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>알비의 분리수거 연구소 - AI 태블릿 연구실</title>
  <style>
    :root {
      --bg: #090e1a;
      --panel-bg: #121929;
      --card-bg: #1a233a;
      --card-hover: #232f4d;
      --accent-cyan: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #fb7185;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #243049;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .tablet-workspace {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 780px;
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 14px;
      background: rgba(18, 25, 41, 0.7);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .left-lab {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow: hidden;
    }

    .robot-hud {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .robot-figure {
      width: 58px;
      height: 58px;
      background: #1e293b;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
      animation: hoverBob 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes hoverBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .robot-dialogue {
      flex: 1;
      background: #172136;
      border: 1px solid #2d3b58;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.45;
      color: #e2e8f0;
      position: relative;
    }

    .robot-dialogue::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #172136;
    }

    .yard-zone {
      flex: 1;
      background: #0f1523;
      border: 2px dashed #28354f;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .zone-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .zone-counter {
      background: #1e293b;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .trash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 7px;
      overflow-y: auto;
      padding-right: 4px;
      flex: 1;
    }

    .trash-grid::-webkit-scrollbar { width: 5px; }
    .trash-grid::-webkit-scrollbar-thumb { background: #243049; border-radius: 4px; }

    .trash-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }

    .trash-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      background: var(--card-hover);
    }

    .trash-icon {
      font-size: 1.7rem;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .trash-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: #f1f5f9;
      text-align: center;
      white-space: nowrap;
    }

    .bins-dock {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex-shrink: 0;
      height: 125px;
    }

    .bin-tank {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .bin-tank.paper { border-color: var(--accent-cyan); }
    .bin-tank.metal { border-color: var(--accent-amber); }
    .bin-tank.plastic { border-color: var(--accent-green); }
    .bin-tank.glass { border-color: var(--accent-rose); }

    .bin-header {
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .bin-tank.paper .bin-header { color: var(--accent-cyan); }
    .bin-tank.metal .bin-header { color: var(--accent-amber); }
    .bin-tank.plastic .bin-header { color: var(--accent-green); }
    .bin-tank.glass .bin-header { color: var(--accent-rose); }

    .bin-contents {
      width: 100%;
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 3px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      padding: 3px;
    }

    .collected-pill {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 5px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 2px;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .right-console {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      height: 100%;
      overflow: hidden;
    }

    .console-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .console-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
    }

    .key-toggle-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .api-drawer {
      display: none;
      background: #0f172a;
      border: 1px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 6px;
      gap: 6px;
    }

    .api-drawer.active { display: flex; }

    .api-drawer input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      color: #fff;
      font-size: 0.74rem;
      outline: none;
    }

    .api-drawer button {
      background: var(--accent-cyan);
      color: #090e1a;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
    }

    .terminal-chat {
      flex: 1;
      background: #090d16;
      border: 1px solid #1a2336;
      border-radius: 12px;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-row {
      display: flex;
      flex-direction: column;
      max-width: 90%;
      line-height: 1.45;
      font-size: 0.83rem;
    }

    .chat-row.user { align-self: flex-end; }
    .chat-row.robot { align-self: flex-start; }

    .chat-author {
      font-size: 0.68rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: var(--text-sub);
    }

    .chat-row.user .chat-author {
      text-align: right;
      color: var(--accent-cyan);
    }

    .chat-bubble {
      padding: 8px 12px;
      border-radius: 12px;
      word-break: keep-all;
    }

    .chat-row.user .chat-bubble {
      background: #0284c7;
      color: #fff;
      border-top-right-radius: 2px;
    }

    .chat-row.robot .chat-bubble {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-top-left-radius: 2px;
    }

    .prompt-box {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .text-input {
      flex: 1;
      height: 44px;
      background: #090d16;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .text-input:focus { border-color: var(--accent-cyan); }

    .send-btn {
      width: 70px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #090e1a;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
    }

    .send-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <main class="tablet-workspace">
    <section class="left-lab">
      <div class="robot-hud">
        <div class="robot-figure" id="robotAvatar">🤖</div>
        <div class="robot-dialogue" id="robotSpeech">
          치익... 삐비빅! 25개의 다양한 물품이 준비되었습니다. 실험 방법과 조건을 문장으로 지시해 주세요!
        </div>
      </div>

      <div class="yard-zone">
        <div class="zone-header">
          <span class="zone-title">📦 미분류 물건 현장</span>
          <span class="zone-counter" id="trashCount">남은 물품: 25개</span>
        </div>
        <div class="trash-grid" id="trashGrid"></div>
      </div>

      <div class="bins-dock">
        <div class="bin-tank paper">
          <div class="bin-header">📄 종이</div>
          <div class="bin-contents" id="binPaper"></div>
        </div>
        <div class="bin-tank metal">
          <div class="bin-header">🥫 철/캔</div>
          <div class="bin-contents" id="binMetal"></div>
        </div>
        <div class="bin-tank plastic">
          <div class="bin-header">🧴 플라스틱</div>
          <div class="bin-contents" id="binPlastic"></div>
        </div>
        <div class="bin-tank glass">
          <div class="bin-header">🍶 유리</div>
          <div class="bin-contents" id="binGlass"></div>
        </div>
      </div>
    </section>

    <section class="right-console">
      <div class="console-topbar">
        <div class="console-title">
          <span>⚡ AI 지휘 콘솔</span>
          <span id="aiBadge" style="font-size: 0.7rem; color: var(--accent-cyan); margin-left: 6px;">대기 중</span>
        </div>
        <button class="key-toggle-btn" id="btnToggleKey">API 키 설정</button>
      </div>

      <div class="api-drawer" id="apiDrawer">
        <input type="password" id="apiKeyInput" placeholder="Gemini API 키 (AIzaSy...)">
        <button id="btnSaveKey">저장</button>
      </div>

      <div class="terminal-chat" id="chatBox">
        <div class="chat-row robot">
          <span class="chat-author">🤖 로봇 알비</span>
          <div class="chat-bubble">
            초고속 모드 가동 완료! 지시를 내리면 즉시 25개 물품을 테스트하여 분류합니다.
          </div>
        </div>
      </div>

      <div class="prompt-box">
        <input type="text" id="userInput" class="text-input" placeholder="알비에게 내릴 실험 방법과 조건을 직접 입력하세요..." autocomplete="off">
        <button id="btnSend" class="send-btn">전송</button>
      </div>
    </section>
  </main>

  <script>
    const TRASH_CATALOG = {
      "신문지": { icon: "📰", category: "종이" },
      "택배 상자": { icon: "📦", category: "종이" },
      "종이컵": { icon: "☕", category: "종이" },
      "우유갑": { icon: "🥛", category: "종이" },
      "전단지": { icon: "📄", category: "종이" },
      "달력": { icon: "📅", category: "종이" },
      "스케치북": { icon: "📒", category: "종이" },

      "음료수 캔": { icon: "🥫", category: "철" },
      "통조림 통": { icon: "🥫", category: "철" },
      "쇠못": { icon: "🔩", category: "철" },
      "클립": { icon: "📎", category: "철" },
      "부탄가스 통": { icon: "🧯", category: "철" },
      "쇠숟가락": { icon: "🥄", category: "철" },

      "페트병": { icon: "🧴", category: "플라스틱" },
      "플라스틱 컵": { icon: "🥤", category: "플라스틱" },
      "샴푸통": { icon: "🧴", category: "플라스틱" },
      "플라스틱 빨대": { icon: "🧃", category: "플라스틱" },
      "배달 용기": { icon: "🥡", category: "플라스틱" },
      "장난감 블록": { icon: "🧱", category: "플라스틱" },

      "유리병": { icon: "🍶", category: "유리" },
      "잼 병": { icon: "🍯", category: "유리" },
      "향수병": { icon: "🧪", category: "유리" },
      "유리컵": { icon: "🥛", category: "유리" },
      "소스 병": { icon: "🍾", category: "유리" },
      "유리 반찬통": { icon: "🥣", category: "유리" }
    };

    let remainingTrash = Object.keys(TRASH_CATALOG);
    let sortedBins = { "종이": [], "철": [], "플라스틱": [], "유리": [] };
    let cachedModelName = null; // 모델명 1회 캐싱

    const SYSTEM_PROMPT = `
당신은 인간의 상식이 전혀 없는 고철 로봇 '알비'입니다.
현재 25개의 쓰레기가 있고, 아이의 실험 지시문을 기계적으로 실행합니다.

[사물 25종의 물리적 속성]
- 종이류(신문지, 택배 상자, 종이컵, 우유갑, 전단지, 달력, 스케치북): 불에 탐, 물에 젖음, 자석 반응 없음, 가벼움
- 철류(음료수 캔, 통조림 통, 쇠못, 클립, 부탄가스 통, 쇠숟가락): 자석에 강하게 붙음, 불 안 탐, 전도성 있음, 물에 가라앉음
- 플라스틱류(페트병, 플라스틱 컵, 샴푸통, 플라스틱 빨대, 배달 용기, 장난감 블록): 불에 녹아 찌그러짐, 물에 뜸, 자석 반응 없음
- 유리류(유리병, 잼 병, 향수병, 유리컵, 소스 병, 유리 반찬통): 투명함, 불 안 탐, 자석 반응 없음, 물에 가라앉음, 깨지기 쉬움

[원칙]
1. 아이의 지시(물, 자석, 불 등)에 부합하는 사물을 판별하고 대사를 작성하세요.
2. 반드시 JSON만 출력하세요.
{
  "speech": "결과 설명 대사",
  "sorted": [{"item": "사물이름", "bin": "종이|철|플라스틱|유리"}]
}
`;

    const trashGridEl = document.getElementById("trashGrid");
    const trashCountEl = document.getElementById("trashCount");
    const robotSpeechEl = document.getElementById("robotSpeech");
    const robotAvatarEl = document.getElementById("robotAvatar");
    const chatBoxEl = document.getElementById("chatBox");
    const userInputEl = document.getElementById("userInput");
    const btnSendEl = document.getElementById("btnSend");
    const aiBadgeEl = document.getElementById("aiBadge");
    const apiDrawerEl = document.getElementById("apiDrawer");
    const apiKeyInputEl = document.getElementById("apiKeyInput");
    const btnSaveKeyEl = document.getElementById("btnSaveKey");
    const btnToggleKeyEl = document.getElementById("btnToggleKey");

    function getActiveKey() {
      return (localStorage.getItem("albi_gemini_key_v6") || apiKeyInputEl.value || "").trim();
    }

    const savedKey = localStorage.getItem("albi_gemini_key_v6");
    if (savedKey) {
      apiKeyInputEl.value = savedKey;
      aiBadgeEl.textContent = "연결 준비됨";
    } else {
      apiDrawerEl.classList.add("active");
    }

    btnToggleKeyEl.addEventListener("click", () => apiDrawerEl.classList.toggle("active"));

    btnSaveKeyEl.addEventListener("click", () => {
      const val = apiKeyInputEl.value.trim();
      if (!val) { alert("API 키를 입력하세요."); return; }
      localStorage.setItem("albi_gemini_key_v6", val);
      cachedModelName = null; // 키 변경 시 모델 재탐색
      apiDrawerEl.classList.remove("active");
      aiBadgeEl.textContent = "연결 준비됨";
      alert("API 키가 저장되었습니다.");
    });

    function renderLab() {
      trashGridEl.innerHTML = "";
      remainingTrash.forEach(item => {
        const card = document.createElement("div");
        card.className = "trash-card";
        const info = TRASH_CATALOG[item] || { icon: "📦" };
        card.innerHTML = `<div class="trash-icon">${info.icon}</div><div class="trash-name">${item}</div>`;
        trashGridEl.appendChild(card);
      });
      trashCountEl.textContent = `남은 물품: ${remainingTrash.length}개`;

      const createPill = (name) => {
        const info = TRASH_CATALOG[name] || { icon: "📦" };
        return `<span class="collected-pill">${info.icon} ${name}</span>`;
      };

      document.getElementById("binPaper").innerHTML = sortedBins["종이"].map(createPill).join("");
      document.getElementById("binMetal").innerHTML = sortedBins["철"].map(createPill).join("");
      document.getElementById("binPlastic").innerHTML = sortedBins["플라스틱"].map(createPill).join("");
      document.getElementById("binGlass").innerHTML = sortedBins["유리"].map(createPill).join("");
    }
    renderLab();

    function addChat(sender, text, isUser) {
      const row = document.createElement("div");
      row.className = `chat-row ${isUser ? "user" : "robot"}`;
      row.innerHTML = `<span class="chat-author">${sender}</span><div class="chat-bubble">${text}</div>`;
      chatBoxEl.appendChild(row);
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    // 1회 탐색 후 캐시하여 초고속 호출
    async function resolveFastModel(apiKey) {
      if (cachedModelName) return cachedModelName;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = data.models || [];
          const m38 = list.find(m => m.name.includes("gemini-3.8-flash") && m.supportedGenerationMethods?.includes("generateContent"));
          if (m38) { cachedModelName = m38.name.replace(/^models\//, ""); return cachedModelName; }

          const flash = list.find(m => m.name.includes("flash") && m.supportedGenerationMethods?.includes("generateContent"));
          if (flash) { cachedModelName = flash.name.replace(/^models\//, ""); return cachedModelName; }
        }
      } catch (e) {
        console.warn(e);
      }
      cachedModelName = "gemini-3.8-flash";
      return cachedModelName;
    }

    btnSendEl.addEventListener("click", sendCommand);
    userInputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") sendCommand(); });

    async function sendCommand() {
      const prompt = userInputEl.value.trim();
      const apiKey = getActiveKey();

      if (!apiKey) {
        apiDrawerEl.classList.add("active");
        alert("우측 상단 'API 키 설정'에서 키를 저장해 주세요.");
        return;
      }
      if (!prompt) return;

      addChat("🧑‍💻 나(아이)", prompt, true);
      userInputEl.value = "";
      btnSendEl.disabled = true;
      aiBadgeEl.textContent = "테스트 실행 중...";
      robotAvatarEl.textContent = "⚡";
      robotSpeechEl.textContent = "치익... 센서 가동! 25개 물품을 즉시 분석합니다...";

      // 15초 타임아웃 컨트롤러
      const controller = new AbortController();
      const timeoutTimer = setTimeout(() => controller.abort(), 15000);

      try {
        const modelName = await resolveFastModel(apiKey);
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
        const fullPrompt = `${SYSTEM_PROMPT}\n\n[남은 물품]: ${JSON.stringify(remainingTrash)}\n[아이의 지시문]: "${prompt}"`;

        // 초고속 모드: thinkingBudget=0 (추론 대기 시간 제거), responseMimeType=JSON
        const requestBody = {
          contents: [{ parts: [{ text: fullPrompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            temperature: 0.1,
            thinkingConfig: { thinkingBudget: 0 }
          }
        };

        let res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody),
          signal: controller.signal
        });

        // thinkingConfig 미지원 모델 대비 폴백
        if (!res.ok && res.status === 400) {
          delete requestBody.generationConfig.thinkingConfig;
          res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody),
            signal: controller.signal
          });
        }

        clearTimeout(timeoutTimer);

        if (!res.ok) {
          const err = await res.json().catch(() => null);
          throw new Error(`[${res.status}] ${err?.error?.message || res.statusText}`);
        }

        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const cleanJson = raw.replace(/```json/g, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        const speech = parsed.speech || "삐비빅... 지시를 수행했습니다.";
        robotSpeechEl.textContent = speech;
        addChat("🤖 로봇 알비", speech, false);
        robotAvatarEl.textContent = "🤖";

        if (parsed.sorted && Array.isArray(parsed.sorted)) {
          parsed.sorted.forEach(entry => {
            const idx = remainingTrash.indexOf(entry.item);
            if (idx !== -1) {
              remainingTrash.splice(idx, 1);
              if (sortedBins[entry.bin]) sortedBins[entry.bin].push(entry.item);
            }
          });
        }

        renderLab();

        if (remainingTrash.length === 0) {
          robotAvatarEl.textContent = "🎉";
          robotSpeechEl.textContent = "대단합니다! 25개의 모든 물품이 올바르게 분리수거되었습니다! 실험 성공!";
          addChat("🎉 연구 완료", "25개의 사물을 완벽하게 분류했습니다!", false);
        }

      } catch (err) {
        clearTimeout(timeoutTimer);
        console.error(err);
        robotAvatarEl.textContent = "⚠️";
        const errMsg = (err.name === "AbortError") ? "응답 시간이 초과되었습니다. 다시 전송해 주세요." : err.message;
        robotSpeechEl.textContent = `삐비빅... 상태: ${errMsg}`;
        addChat("⚠️ 안내", errMsg, false);
      } finally {
        btnSendEl.disabled = false;
        aiBadgeEl.textContent = "대기 중";
        userInputEl.focus();
      }
    }
  </script>
</body>
</html>
