<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>알비의 분리수거 연구소 - AI 태블릿 연구실</title>
  <style>
    :root {
      --bg: #090e1a;
      --panel-bg: #121929;
      --card-bg: #1a233a;
      --card-hover: #232f4d;
      --accent-cyan: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #fb7185;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #243049;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* 태블릿 가로 2분할 컨테이너 */
    .tablet-workspace {
      width: 100%;
      max-width: 1180px;
      height: 100%;
      max-height: 760px;
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 14px;
      background: rgba(18, 25, 41, 0.7);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* 좌측: 시각 연구실 (로봇, 쓰레기장, 수거함) */
    .left-lab {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      overflow: hidden;
    }

    /* 로봇 현장 뷰어 */
    .robot-hud {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .robot-figure {
      width: 64px;
      height: 64px;
      background: #1e293b;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
      animation: hoverBob 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes hoverBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .robot-dialogue {
      flex: 1;
      background: #172136;
      border: 1px solid #2d3b58;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #e2e8f0;
      position: relative;
    }

    .robot-dialogue::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #172136;
    }

    /* 쓰레기 더미 시각 구역 */
    .yard-zone {
      flex: 1;
      background: #0f1523;
      border: 2px dashed #28354f;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .zone-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zone-counter {
      background: #1e293b;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* 아이템 시각 카드 그리드 */
    .trash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding: 4px;
      align-content: start;
      flex: 1;
    }

    .trash-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
      cursor: default;
    }

    .trash-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-cyan);
      background: var(--card-hover);
    }

    .trash-icon {
      font-size: 2.2rem;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
    }

    .trash-name {
      font-size: 0.78rem;
      font-weight: 800;
      color: #f1f5f9;
      text-align: center;
      white-space: nowrap;
    }

    /* 4대 분리수거함 시각 그래픽 */
    .bins-dock {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      flex-shrink: 0;
      height: 125px;
    }

    .bin-tank {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .bin-tank.paper { border-color: var(--accent-cyan); }
    .bin-tank.metal { border-color: var(--accent-amber); }
    .bin-tank.plastic { border-color: var(--accent-green); }
    .bin-tank.glass { border-color: var(--accent-rose); }

    .bin-header {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .bin-tank.paper .bin-header { color: var(--accent-cyan); }
    .bin-tank.metal .bin-header { color: var(--accent-amber); }
    .bin-tank.plastic .bin-header { color: var(--accent-green); }
    .bin-tank.glass .bin-header { color: var(--accent-rose); }

    .bin-contents {
      width: 100%;
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 4px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 4px;
    }

    .collected-pill {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 3px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 우측: AI 지휘 콘솔 & 직접 입력 */
    .right-console {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      height: 100%;
      overflow: hidden;
    }

    .console-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .console-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-toggle-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 모달 형태의 API 설정창 */
    .api-drawer {
      display: none;
      background: #0f172a;
      border: 1px solid var(--accent-cyan);
      border-radius: 10px;
      padding: 8px;
      gap: 6px;
    }

    .api-drawer.active {
      display: flex;
    }

    .api-drawer input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      color: #fff;
      font-size: 0.75rem;
      outline: none;
    }

    .api-drawer button {
      background: var(--accent-cyan);
      color: #090e1a;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* 대화 로그 터미널 */
    .terminal-chat {
      flex: 1;
      background: #090d16;
      border: 1px solid #1a2336;
      border-radius: 12px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-row {
      display: flex;
      flex-direction: column;
      max-width: 90%;
      line-height: 1.45;
      font-size: 0.85rem;
    }

    .chat-row.user {
      align-self: flex-end;
    }

    .chat-row.robot {
      align-self: flex-start;
    }

    .chat-author {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: var(--text-sub);
    }

    .chat-row.user .chat-author {
      text-align: right;
      color: var(--accent-cyan);
    }

    .chat-bubble {
      padding: 9px 13px;
      border-radius: 12px;
      word-break: keep-all;
    }

    .chat-row.user .chat-bubble {
      background: #0284c7;
      color: #fff;
      border-top-right-radius: 2px;
    }

    .chat-row.robot .chat-bubble {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-top-left-radius: 2px;
    }

    /* 하단 키보드 직접 입력창 */
    .prompt-box {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      padding-top: 4px;
    }

    .text-input {
      flex: 1;
      height: 48px;
      background: #090d16;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .text-input:focus {
      border-color: var(--accent-cyan);
    }

    .send-btn {
      width: 76px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #090e1a;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .send-btn:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    @media (max-width: 850px) {
      body { overflow-y: auto; height: auto; }
      .tablet-workspace { grid-template-columns: 1fr; height: auto; max-height: none; }
      .yard-zone { min-height: 220px; }
      .right-console { height: 480px; }
    }
  </style>
</head>
<body>

  <main class="tablet-workspace">
    <!-- 좌측: 시각 연구실 공간 -->
    <section class="left-lab">
      <!-- 상단 로봇 모니터 -->
      <div class="robot-hud">
        <div class="robot-figure" id="robotAvatar">🤖</div>
        <div class="robot-dialogue" id="robotSpeech">
          치익... 삐비빅! 쓰레기장에 여러 물건이 뒤섞여 있습니다. 저는 인간의 상식이 없어서 무엇인지 모릅니다. 실험 조건이나 구분 방법을 직접 타이핑해 명령해 주세요!
        </div>
      </div>

      <!-- 중앙 쓰레기 더미 시각 카드 구역 -->
      <div class="yard-zone">
        <div class="zone-header">
          <div class="zone-title">
            <span>📦 미분류 물건 현장</span>
          </div>
          <span class="zone-counter" id="trashCount">남은 물품: 7개</span>
        </div>
        <div class="trash-grid" id="trashGrid">
          <!-- 사물 카드 동적 렌더링 -->
        </div>
      </div>

      <!-- 하단 4대 분리수거함 -->
      <div class="bins-dock">
        <div class="bin-tank paper">
          <div class="bin-header">📄 종이</div>
          <div class="bin-contents" id="binPaper"></div>
        </div>
        <div class="bin-tank metal">
          <div class="bin-header">🥫 철/캔</div>
          <div class="bin-contents" id="binMetal"></div>
        </div>
        <div class="bin-tank plastic">
          <div class="bin-header">🧴 플라스틱</div>
          <div class="bin-contents" id="binPlastic"></div>
        </div>
        <div class="bin-tank glass">
          <div class="bin-header">🍶 유리</div>
          <div class="bin-contents" id="binGlass"></div>
        </div>
      </div>
    </section>

    <!-- 우측: AI 지휘 콘솔 & 직접 텍스트 입력창 -->
    <section class="right-console">
      <div class="console-topbar">
        <div class="console-title">
          <span>⚡ AI 지휘 콘솔</span>
          <span id="aiBadge" style="font-size: 0.72rem; color: var(--accent-cyan); font-weight: 700;">대기 중</span>
        </div>
        <button class="key-toggle-btn" id="btnToggleKey">API 키 설정</button>
      </div>

      <!-- API 키 드로어 -->
      <div class="api-drawer" id="apiDrawer">
        <input type="password" id="apiKeyInput" placeholder="Gemini API 키 (AIzaSy...)">
        <button id="btnSaveKey">저장</button>
      </div>

      <!-- 메신저 스타일 터미널 로그 -->
      <div class="terminal-chat" id="chatBox">
        <div class="chat-row robot">
          <span class="chat-author">🤖 로봇 알비</span>
          <div class="chat-bubble">
            센서 준비 완료. 아이들이 내리는 명령을 글자 그대로 실행할 준비가 되었습니다!
          </div>
        </div>
      </div>

      <!-- 아이가 직접 타이핑하는 텍스트 입력부 -->
      <div class="prompt-box">
        <input type="text" id="userInput" class="text-input" placeholder="알비에게 내릴 실험 방법과 조건을 직접 입력하세요..." autocomplete="off">
        <button id="btnSend" class="send-btn">전송</button>
      </div>
    </section>
  </main>

  <script>
    // 1. 사물 데이터베이스 (시각 그래픽 아이콘 매핑)
    const TRASH_CATALOG = {
      "신문지": { icon: "📰", type: "paper" },
      "택배 상자": { icon: "📦", type: "paper" },
      "음료수 캔": { icon: "🥫", type: "metal" },
      "통조림 통": { icon: "🥫", type: "metal" },
      "페트병": { icon: "🧴", type: "plastic" },
      "플라스틱 컵": { icon: "🥤", type: "plastic" },
      "유리병": { icon: "🍶", type: "glass" }
    };

    let remainingTrash = Object.keys(TRASH_CATALOG);
    let sortedBins = { "종이": [], "철": [], "플라스틱": [], "유리": [] };

    // 2. 알비 로봇 두뇌 프롬프트
    const SYSTEM_PROMPT = `
당신은 인간의 상식이 전혀 없는 정밀 로봇 '알비'입니다.
현재 쓰레기장에 있고, 아이가 키보드로 직접 타이핑한 실험 지시문을 기계적/논리적으로 실행합니다.

[사물들의 물리적 속성 팩트]
- 신문지, 택배 상자: 불에 활활 탐, 자석에 안 붙음, 물에 젖어 가라앉음, 가벼움
- 음료수 캔, 통조림 통: 불에 안 탐, 자석에 강하게 붙음, 물에 가라앉음, 전기가 통함
- 페트병, 플라스틱 컵: 불에 오그라들며 녹음, 자석에 안 붙음, 물에 뜸
- 유리병: 불에 안 탐, 자석에 안 붙음, 물에 가라앉음, 투명하고 깨지기 쉬움

[행동 원칙]
1. 아이가 직접 입력한 물리적 실험(자석, 불, 물, 두드리기, 무게 비교 등)과 조건문을 문자 그대로 수행합니다.
2. "알아서 나눠", "그냥 버려" 같은 상식에 기댄 지시는 "삐비빅! 어떤 기준으로 나눠야 하는지 조건 데이터가 없습니다!"라며 거부하세요.
3. 아이의 지시 조건에 부합하여 식별된 사물만 bin("종이", "철", "플라스틱", "유리")에 분류하세요.
4. 반드시 순수 JSON만 출력하세요:
{
  "speech": "로봇의 대사 (아이 눈높이에서 실험 과정과 결과를 생생하게 설명)",
  "sorted": [
    {"item": "사물이름", "bin": "종이|철|플라스틱|유리"}
  ]
}
`;

    // DOM 참조
    const trashGridEl = document.getElementById("trashGrid");
    const trashCountEl = document.getElementById("trashCount");
    const robotSpeechEl = document.getElementById("robotSpeech");
    const robotAvatarEl = document.getElementById("robotAvatar");
    const chatBoxEl = document.getElementById("chatBox");
    const userInputEl = document.getElementById("userInput");
    const btnSendEl = document.getElementById("btnSend");
    const aiBadgeEl = document.getElementById("aiBadge");
    const apiDrawerEl = document.getElementById("apiDrawer");
    const apiKeyInputEl = document.getElementById("apiKeyInput");
    const btnSaveKeyEl = document.getElementById("btnSaveKey");
    const btnToggleKeyEl = document.getElementById("btnToggleKey");

    // API 키 관리
    function getActiveKey() {
      return (localStorage.getItem("albi_gemini_key_v4") || apiKeyInputEl.value || "").trim();
    }

    const savedKey = localStorage.getItem("albi_gemini_key_v4");
    if (savedKey) {
      apiKeyInputEl.value = savedKey;
      aiBadgeEl.textContent = "연결 준비됨";
    } else {
      apiDrawerEl.classList.add("active");
    }

    btnToggleKeyEl.addEventListener("click", () => {
      apiDrawerEl.classList.toggle("active");
    });

    btnSaveKeyEl.addEventListener("click", () => {
      const val = apiKeyInputEl.value.trim();
      if (!val) {
        alert("API 키를 입력하세요.");
        return;
      }
      localStorage.setItem("albi_gemini_key_v4", val);
      apiDrawerEl.classList.remove("active");
      aiBadgeEl.textContent = "연결 준비됨";
      alert("API 키가 저장되었습니다.");
    });

    // 화면 렌더링
    function renderLab() {
      trashGridEl.innerHTML = "";
      remainingTrash.forEach(item => {
        const card = document.createElement("div");
        card.className = "trash-card";
        const info = TRASH_CATALOG[item] || { icon: "📦" };
        card.innerHTML = `
          <div class="trash-icon">${info.icon}</div>
          <div class="trash-name">${item}</div>
        `;
        trashGridEl.appendChild(card);
      });
      trashCountEl.textContent = `남은 물품: ${remainingTrash.length}개`;

      const createPill = (name) => {
        const info = TRASH_CATALOG[name] || { icon: "📦" };
        return `<span class="collected-pill">${info.icon} ${name}</span>`;
      };

      document.getElementById("binPaper").innerHTML = sortedBins["종이"].map(createPill).join("");
      document.getElementById("binMetal").innerHTML = sortedBins["철"].map(createPill).join("");
      document.getElementById("binPlastic").innerHTML = sortedBins["플라스틱"].map(createPill).join("");
      document.getElementById("binGlass").innerHTML = sortedBins["유리"].map(createPill).join("");
    }
    renderLab();

    function addChat(sender, text, isUser) {
      const row = document.createElement("div");
      row.className = `chat-row ${isUser ? "user" : "robot"}`;
      row.innerHTML = `
        <span class="chat-author">${sender}</span>
        <div class="chat-bubble">${text}</div>
      `;
      chatBoxEl.appendChild(row);
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    // 최신 Flash 모델 자동 감지 (404 방지)
    async function getUsableModel(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = data.models || [];
          const flash = list.find(m => m.name.includes("flash") && m.supportedGenerationMethods?.includes("generateContent"));
          if (flash) return flash.name;
        }
      } catch (e) {
        console.warn(e);
      }
      return "models/gemini-2.0-flash";
    }

    // 명령 전송 처리
    btnSendEl.addEventListener("click", sendCommand);
    userInputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendCommand();
    });

    async function sendCommand() {
      const prompt = userInputEl.value.trim();
      const apiKey = getActiveKey();

      if (!apiKey) {
        apiDrawerEl.classList.add("active");
        alert("우측 상단 'API 키 설정'을 열어 Gemini API 키를 먼저 저장해 주세요.");
        return;
      }
      if (!prompt) return;

      addChat("🧑‍💻 나(아이)", prompt, true);
      userInputEl.value = "";
      btnSendEl.disabled = true;
      aiBadgeEl.textContent = "실험 분석 중...";
      robotAvatarEl.textContent = "⚡";
      robotSpeechEl.textContent = "치익... 센서 가동 중! 명령을 물리적으로 시도해 봅니다...";

      try {
        const modelName = await getUsableModel(apiKey);
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;
        const fullPrompt = `${SYSTEM_PROMPT}\n\n[현재 남은 쓰레기]: ${JSON.stringify(remainingTrash)}\n[아이의 직접 지시문]: "${prompt}"`;

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => null);
          throw new Error(`[${res.status}] ${err?.error?.message || res.statusText}`);
        }

        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const cleanJson = raw.replace(/```json/g, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        const speech = parsed.speech || "삐비빅... 지시를 수행했습니다.";
        robotSpeechEl.textContent = speech;
        addChat("🤖 로봇 알비", speech, false);
        robotAvatarEl.textContent = "🤖";

        if (parsed.sorted && Array.isArray(parsed.sorted)) {
          parsed.sorted.forEach(entry => {
            const idx = remainingTrash.indexOf(entry.item);
            if (idx !== -1) {
              remainingTrash.splice(idx, 1);
              if (sortedBins[entry.bin]) sortedBins[entry.bin].push(entry.item);
            }
          });
        }

        renderLab();

        if (remainingTrash.length === 0) {
          robotAvatarEl.textContent = "🎉";
          robotSpeechEl.textContent = "대단합니다! 모든 쓰레기가 올바르게 분리수거되었습니다! 실험 성공!";
          addChat("🎉 연구 완료", "모든 사물을 완벽하게 분리했습니다!", false);
        }

      } catch (err) {
        console.error(err);
        robotAvatarEl.textContent = "⚠️";
        robotSpeechEl.textContent = `삐비빅... 오류: ${err.message}`;
        addChat("⚠️ 시스템 오류", err.message, false);
      } finally {
        btnSendEl.disabled = false;
        aiBadgeEl.textContent = "대기 중";
        userInputEl.focus();
      }
    }
  </script>
</body>
</html>
